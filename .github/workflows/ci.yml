name: Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 添加 gradlew 执行权限
        run: chmod +x gradlew

      - name: 创建 google-services.json（支持所有包名变体）
        run: |
          mkdir -p app
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.yenaly.han1meviewer"
                  }
                },
                "oauth_client": [],
                "api_key": [],
                "services": {
                  "analytics_service": {
                    "status": 1
                  },
                  "appinvite_service": {
                    "status": 1
                  },
                  "ads_service": {
                    "status": 1
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.yenaly.han1meviewer.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [],
                "services": {
                  "analytics_service": {
                    "status": 1
                  },
                  "appinvite_service": {
                    "status": 1
                  },
                  "ads_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "✅ google-services.json 创建成功"
          echo "包含的包名:"
          grep -o '"package_name": "[^"]*"' app/google-services.json

      - name: 构建 APK
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            echo "📦 构建 Release APK"
            ./gradlew assembleRelease
          else
            echo "📦 构建 Debug APK"
            ./gradlew assembleDebug
          fi
        env:
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 显示构建信息
        if: always()
        run: |
          echo "==================== 构建信息 ===================="
          if [ -f app/build/outputs/apk/debug/*.apk ]; then
            echo "✅ Debug APK 已生成"
            ls -lh app/build/outputs/apk/debug/
          fi
          if [ -f app/build/outputs/apk/release/*.apk ]; then
            echo "✅ Release APK 已生成"
            ls -lh app/build/outputs/apk/release/
          fi
          echo "=================================================="
