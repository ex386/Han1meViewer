name: Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 添加 gradlew 执行权限
        run: chmod +x gradlew

      # 创建空的 google-services.json 避免构建失败
      - name: 创建 google-services.json
        run: |
          mkdir -p app
          echo '{
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.app"
                  }
                },
                "oauth_client": [],
                "api_key": [],
                "services": {
                  "analytics_service": {
                    "status": 1
                  },
                  "appinvite_service": {
                    "status": 1
                  },
                  "ads_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > app/google-services.json
          echo "✅ google-services.json 创建成功"

      - name: 构建 APK
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            echo "构建 Release APK（使用 Debug 签名）"
            ./gradlew assembleRelease
          else
            echo "构建 Debug APK"
            ./gradlew assembleDebug
          fi
        env:
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 构建完成
        run: |
          echo "🎉 APK 构建成功！"
          echo "📱 下载路径在 Artifacts 中"
